<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Dashboard - KRMU ECHOSENSE">
    <meta name="theme-color" content="#0a0a0c">
    <title>Admin Dashboard - KRMU ECHOSENSE</title>

    <script>
        (function () {
            const theme = localStorage.getItem('krmu-theme') || 'system';
            const resolved = theme === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : theme;
            document.documentElement.dataset.theme = resolved;
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/liquid-glass.css">
    <link rel="stylesheet" href="styles/dashboard.css">

    <style>
        .admin-table-container {
            margin-top: 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur)) saturate(1.2);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border-color);
            box-shadow: var(--glass-shadow-combined);
            overflow-x: auto;
        }

        .admin-table {
            width: 100%;
            min-width: 800px;
            border-collapse: collapse;
            font-size: var(--text-sm);
        }

        .admin-table th {
            text-align: left;
            padding: var(--space-4);
            background: hsl(var(--primary) / 0.1);
            font-weight: var(--font-semibold);
            color: hsl(var(--muted-foreground));
            border-bottom: 1px solid hsl(var(--border));
        }

        .admin-table td {
            padding: var(--space-4);
            border-bottom: 1px solid hsl(var(--border) / 0.5);
            vertical-align: middle;
            color: hsl(var(--foreground));
        }

        .admin-table tr:hover {
            background: hsl(var(--primary) / 0.05);
        }

        .badge--volunteer { background: hsl(210 90% 55% / 0.15); color: hsl(210 90% 55%); }
        .badge--quiz { background: hsl(142 64% 38% / 0.15); color: hsl(142 64% 38%); }

        .btn--delete {
            color: hsl(var(--destructive));
            padding: var(--space-2);
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .btn--delete:hover {
            background: hsl(var(--destructive) / 0.15);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--space-6);
            margin-bottom: var(--space-8);
        }

        .stat-card {
            padding: var(--space-6);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border-color);
            border-radius: var(--radius-lg);
            text-align: center;
            box-shadow: var(--glass-shadow-combined);
            backdrop-filter: blur(var(--glass-blur)) saturate(1.2);
        }

        .stat-card__value {
            font-size: 2.5rem;
            font-weight: var(--font-bold);
            color: hsl(var(--primary));
            margin-bottom: var(--space-2);
        }

        .stat-card__label {
            font-size: var(--text-sm);
            color: hsl(var(--muted-foreground));
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: var(--font-medium);
        }
        
        .flex-row-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-4);
        }
        
        .title-text {
            font-size: var(--text-xl);
            font-weight: var(--font-bold);
            color: hsl(var(--foreground));
        }
    </style>
</head>

<body>
    <div class="video-bg-container">
        <video id="bgVideo" class="back-video" autoplay loop muted playsinline preload="metadata">
            <source src="green-forest-moewalls-com.mp4" type="video/mp4">
        </video>
    </div>
    <div class="video-overlay"></div>

    <header class="site-header">
        <div class="site-header__inner">
            <a href="/" class="site-header__brand">
                KRMU <span class="site-header__brand-accent">ECHOSENSE</span>
                <span class="badge badge--destructive" style="margin-left: 8px;">ADMIN</span>
            </a>
            
            <nav class="site-header__nav" style="gap: 16px;">
                <button id="exportBtn" class="btn btn--secondary btn--sm">Export CSV</button>
                <button id="adminLogoutBtn" class="btn btn--ghost btn--sm">Logout</button>
            </nav>
        </div>
    </header>

    <main class="container mt-6 mb-6">
        <div class="stats-grid">
            <div class="stat-card">
                <div id="statTotalResponses" class="stat-card__value">0</div>
                <div class="stat-card__label">Total Responses</div>
            </div>
            <div class="stat-card">
                <div id="statTotalVolunteers" class="stat-card__value">0</div>
                <div class="stat-card__label">Total Volunteers</div>
            </div>
            <div class="stat-card">
                <div id="statTotalQuizzes" class="stat-card__value">0</div>
                <div class="stat-card__label">Quizzes Completed</div>
            </div>
        </div>

        <div class="flex-row-between">
            <h2 class="title-text">All User Responses</h2>
            <div>
                <input type="text" id="searchInput" class="input" style="height: 36px;" placeholder="Search name or dept...">
            </div>
        </div>

        <div class="admin-table-container">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Type</th>
                        <th>Score</th>
                        <th class="text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="adminResponsesTable">
                    <tr>
                        <td colspan="6" class="text-center py-8 text-muted">Loading responses...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/env-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/admin-dashboard.js"></script>
</body>

</html>
