<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Dashboard - KRMU ECHOSENSE">
    <meta name="theme-color" content="#0a0a0c">
    <title>Admin Dashboard - KRMU ECHOSENSE</title>

    <script>
        (function () {
            const theme = localStorage.getItem('krmu-theme') || 'system';
            const resolved = theme === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : theme;
            document.documentElement.dataset.theme = resolved;
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/liquid-glass.css">
    <link rel="stylesheet" href="styles/dashboard.css">

    <style>
        .admin-table-container {
            margin-top: 2rem;
            background: rgba(var(--bg-rgb), 0.5);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(var(--border-rgb), 0.1);
            overflow: hidden;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        .admin-table th {
            text-align: left;
            padding: 1rem;
            background: rgba(var(--primary-rgb), 0.1);
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(var(--border-rgb), 0.1);
        }

        .admin-table td {
            padding: 1rem;
            border-bottom: 1px solid rgba(var(--border-rgb), 0.05);
            vertical-align: middle;
        }

        .admin-table tr:hover {
            background: rgba(var(--primary-rgb), 0.02);
        }

        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge--volunteer { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .badge--quiz { background: rgba(16, 185, 129, 0.1); color: #10b981; }

        .btn--delete {
            color: #ef4444;
            padding: 0.5rem;
            border-radius: 0.375rem;
            transition: all 0.2s;
        }

        .btn--delete:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            padding: 1.5rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            text-align: center;
        }

        .stat-card__value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .stat-card__label {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>

<body class="dashboard-body">
    <div class="video-bg-container">
        <video id="bgVideo" class="back-video" autoplay loop muted playsinline preload="metadata">
            <source src="green-forest-moewalls-com.mp4" type="video/mp4">
        </video>
    </div>
    <div class="video-overlay"></div>

    <header class="dashboard-header">
        <div class="container flex justify-between items-center h-full">
            <div class="flex items-center gap-4">
                <a href="/" class="auth-header__brand">
                    KRMU <span class="auth-header__brand-accent">ECHOSENSE</span>
                </a>
                <span class="text-xs opacity-50 px-2 py-0.5 border border-current rounded-full">ADMIN PANEL</span>
            </div>
            
            <div class="flex items-center gap-4">
                <button id="exportBtn" class="btn btn--secondary btn--sm">Export CSV</button>
                <button id="adminLogoutBtn" class="btn btn--ghost btn--sm">Logout</button>
            </div>
        </div>
    </header>

    <main class="container py-8">
        <div class="stats-grid">
            <div class="stat-card">
                <div id="statTotalResponses" class="stat-card__value">0</div>
                <div class="stat-card__label">Total Responses</div>
            </div>
            <div class="stat-card">
                <div id="statTotalVolunteers" class="stat-card__value">0</div>
                <div class="stat-card__label">Total Volunteers</div>
            </div>
            <div class="stat-card">
                <div id="statTotalQuizzes" class="stat-card__value">0</div>
                <div class="stat-card__label">Quizzes Completed</div>
            </div>
        </div>

        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold">All User Responses</h2>
            <div class="flex gap-2">
                <input type="text" id="searchInput" class="input input--sm" placeholder="Search name or dept...">
            </div>
        </div>

        <div class="admin-table-container">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Type</th>
                        <th>Score</th>
                        <th class="text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="adminResponsesTable">
                    <tr>
                        <td colspan="6" class="text-center py-8 text-muted">Loading responses...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/env-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/admin-dashboard.js"></script>
</body>

</html>
